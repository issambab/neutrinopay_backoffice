name: CI/CD Backoffice VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "22"
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8080/api/v1' }}
  BACKEND_API_BASE_URL: ${{ vars.BACKEND_API_BASE_URL || 'http://localhost:8080/api/v1' }}
  BACKOFFICE_DEFAULT_TENANT_ID: ${{ vars.BACKOFFICE_DEFAULT_TENANT_ID || '11111111-1111-1111-1111-111111111111' }}

jobs:
  test:
    name: Quality and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --pretty false --incremental false

      - name: Build Next.js
        env:
          BACKEND_API_BASE_URL: ${{ env.BACKEND_API_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
          BACKOFFICE_DEFAULT_TENANT_ID: ${{ env.BACKOFFICE_DEFAULT_TENANT_ID }}
        run: npm run build

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    env:
      BACKOFFICE_IMAGE: ${{ needs.build-and-push.outputs.image }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_BACKOFFICE_DIR: ${{ secrets.VPS_BACKOFFICE_DIR }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"
          : "${VPS_BACKOFFICE_DIR:?Missing VPS_BACKOFFICE_DIR secret}"

          VPS_PORT="${VPS_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          ssh-keygen -lf ~/.ssh/deploy_key.pub

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
            -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "echo 'SSH connection ok'"

      - name: Deploy compose stack
        shell: bash
        run: |
          set -euo pipefail

          VPS_PORT="${VPS_PORT:-22}"
          GHCR_USERNAME="${GHCR_USERNAME:-${{ github.actor }}}"
          GHCR_TOKEN="${GHCR_TOKEN:-${{ github.token }}}"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
            -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             cd '$VPS_BACKOFFICE_DIR'
             git fetch --prune origin
             git checkout main
             git pull --ff-only origin main
             printf 'BACKOFFICE_IMAGE=%s\n' '$BACKOFFICE_IMAGE' > .deploy.env
             printf '%s\n' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin
             docker compose --env-file .env.prod --env-file .deploy.env -f docker-compose.prod.yml pull backoffice
             docker compose --env-file .env.prod --env-file .deploy.env -f docker-compose.prod.yml up -d --no-build --remove-orphans backoffice
             docker compose --env-file .env.prod --env-file .deploy.env -f docker-compose.prod.yml ps
             docker image prune -f"

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail

          VPS_PORT="${VPS_PORT:-22}"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o PreferredAuthentications=publickey \
            -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             cd '$VPS_BACKOFFICE_DIR'
             for attempt in \$(seq 1 30); do
               if docker compose --env-file .env.prod --env-file .deploy.env -f docker-compose.prod.yml exec -T backoffice node -e \"fetch('http://127.0.0.1:3000/auth/v2/login').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\"; then
                 echo 'Backoffice health check passed'
                 exit 0
               fi

               echo \"Waiting for backoffice health check... attempt \$attempt/30\"
               sleep 5
             done

             echo 'Backoffice health check failed. Recent logs:'
             docker compose --env-file .env.prod --env-file .deploy.env -f docker-compose.prod.yml ps
             docker compose --env-file .env.prod --env-file .deploy.env -f docker-compose.prod.yml logs --tail=200 backoffice
             exit 1"
